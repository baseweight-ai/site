<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #080808;
  --bg-secondary: #0d0d0d;
  --bg-card: #111111;
  --border: #1c1c1c;
  --text-primary: #e8e4de;
  --text-secondary: #898580;
  --text-muted: #807d76;
  --accent: #dcb875;
  --accent-hover: #dbb960;
  --font-display: 'Syne', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --max-width: 1120px;
  --section-pad: clamp(80px, 12vh, 140px);
}

html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body { font-family: var(--font-mono); font-size: 15px; line-height: 1.75; color: var(--text-primary); background: var(--bg-primary); overflow-x: hidden; }

::selection { background: var(--accent); color: var(--bg-primary); }

a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
a:hover { color: var(--accent-hover); }

.container { max-width: var(--max-width); margin: 0 auto; padding: 0 clamp(24px, 5vw, 48px); }


h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; }
h1 { font-size: clamp(2rem, 4.5vw, 3.2rem); }
h2 { font-size: clamp(1.2rem, 2.2vw, 1.6rem); margin-bottom: 16px; margin-top: 48px; color: var(--text-primary); }

.section-label { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
.section-label::before { content: ''; width: 24px; height: 1px; background: var(--accent); }

.contact-hero { padding-top: calc(72px + var(--section-pad)); padding-bottom: 40px; border-bottom: 1px solid var(--border); }
.contact-body { padding: var(--section-pad) 0; }
.contact-inner { max-width: 640px; }
.contact-inner p { font-size: 14px; color: var(--text-secondary); line-height: 1.85; margin-bottom: 24px; }
.contact-inner ul { margin-bottom: 24px; padding-left: 20px; list-style: none; }
.contact-inner ul li { font-size: 14px; color: var(--text-secondary); line-height: 1.85; margin-bottom: 10px; padding-left: 16px; position: relative; }
.contact-inner ul li::before { content: '\2014'; position: absolute; left: 0; color: var(--accent); font-weight: 600; }

.contact-method { display: flex; flex-direction: column; gap: 8px; margin-bottom: 40px; padding: 24px; border: 1px solid var(--border); background: var(--bg-card); }
.contact-method-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
.contact-method-value { font-size: 15px; color: var(--text-primary); }

.btn-primary { display: inline-block; background: var(--accent); color: var(--bg-primary); font-family: var(--font-mono); font-size: 13px; font-weight: 600; padding: 14px 28px; letter-spacing: 0.04em; transition: background 0.2s; }
.btn-primary:hover { background: var(--accent-hover); color: var(--bg-primary); }


@media (max-width: 640px) {
  .contact-hero { padding-top: 120px; }
}
</style>
