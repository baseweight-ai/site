<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Syne:wght@800&amp;display=swap');
    </style>
    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="0"  cy="0"  r="0.8" fill="#1c1c1c"/>
      <circle cx="48" cy="0"  r="0.8" fill="#1c1c1c"/>
      <circle cx="0"  cy="48" r="0.8" fill="#1c1c1c"/>
      <circle cx="48" cy="48" r="0.8" fill="#1c1c1c"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#080808"/>

  <!-- Dot grid overlay -->
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Gold top bar -->
  <rect x="0" y="0" width="1200" height="3" fill="#c9a84c"/>

  <!-- Outer frame -->
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#1c1c1c" stroke-width="1"/>

  <!-- Left gold accent bar -->
  <rect x="88" y="188" width="3" height="200" fill="#c9a84c" opacity="0.25"/>

  <!-- Main wordmark -->
  <text
    x="108"
    y="312"
    font-family="'Syne', system-ui, -apple-system, sans-serif"
    font-size="92"
    font-weight="800"
    fill="#e8e4de"
    letter-spacing="-2"
  >Baseweight</text>

  <!-- Gold rule under wordmark -->
  <rect x="108" y="332" width="120" height="2" fill="#c9a84c"/>

  <!-- Tagline -->
  <text
    x="108"
    y="382"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-size="26"
    fill="#898580"
  >Domain AI Adaptation,</text>
  <text
    x="108"
    y="416"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-size="26"
    fill="#898580"
  >Diagnosed and Built.</text>

  <!-- URL -->
  <text
    x="108"
    y="548"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-size="16"
    fill="#555"
  >baseweight.vercel.app</text>

  <!-- Right-side diagnostic selector (technique menu) -->
  <!-- Outer bracket box -->
  <rect x="820" y="188" width="300" height="226" fill="none" stroke="#1c1c1c" stroke-width="1"/>
  <!-- Top-left corner mark -->
  <rect x="820" y="188" width="24" height="2" fill="#c9a84c" opacity="0.5"/>
  <rect x="820" y="188" width="2"  height="24" fill="#c9a84c" opacity="0.5"/>
  <!-- Bottom-right corner mark -->
  <rect x="1096" y="412" width="24" height="2" fill="#c9a84c" opacity="0.5" transform="translate(-24,0)"/>
  <rect x="1118" y="390" width="2"  height="24" fill="#c9a84c" opacity="0.5"/>

  <!-- DIAGNOSTIC label -->
  <text
    x="836"
    y="210"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-size="11"
    fill="#c9a84c"
    opacity="0.6"
    letter-spacing="2"
  >TECHNIQUE SELECTION</text>

  <!-- Divider -->
  <rect x="820" y="218" width="300" height="1" fill="#1c1c1c"/>

  <!-- Technique rows — one highlighted (RAG selected) -->
  <rect x="820" y="219" width="300" height="40" fill="#c9a84c" opacity="0.05"/>
  <text x="844" y="245" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="14" fill="#c9a84c">▸ RAG</text>
  <text x="940" y="245" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" fill="#c9a84c" opacity="0.5">retrieval augmentation</text>

  <rect x="820" y="259" width="300" height="40" fill="none"/>
  <text x="844" y="285" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="14" fill="#555">  FINE-TUNE</text>
  <text x="960" y="285" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" fill="#333">LoRA / QLoRA</text>

  <rect x="820" y="299" width="300" height="40" fill="none"/>
  <text x="844" y="325" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="14" fill="#555">  DPO</text>
  <text x="920" y="325" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" fill="#333">preference alignment</text>

  <rect x="820" y="339" width="300" height="40" fill="none"/>
  <text x="844" y="365" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="14" fill="#555">  COMPRESS</text>
  <text x="960" y="365" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" fill="#333">quant / prune</text>

  <!-- Row dividers -->
  <rect x="820" y="259" width="300" height="1" fill="#111"/>
  <rect x="820" y="299" width="300" height="1" fill="#111"/>
  <rect x="820" y="339" width="300" height="1" fill="#111"/>
  <rect x="820" y="379" width="300" height="1" fill="#111"/>

</svg>
